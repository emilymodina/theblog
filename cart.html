                <a href="aboutme.html" class="nav-link">About Me</a>

        </section>

        <!-- CART -->

        <div class="cart-page">

            <!-- LEFT COLUMN -->
            <section class="cart">
                <h1>Cart</h1>

                <div class="cart-item">
                    <img src="img/img.png" alt="Item name" class="item-img">
                    <div class="item-info">
                        <h2>Name</h2>
                        <p>Short description of item</p>
                        <p>Condition</p>
                        <p class="price">Price $</p>
                    </div>
                </div>

                <div class="cart-item">
                    <img src="img/img.png" alt="Item name" class="item-img">
                    <div class="item-info">
                        <h2>Name</h2>
                        <p>Short description of item</p>
                        <p>Condition</p>
                        <p class="price">Price $</p>
                    </div>
                </div>

                <div class="cart-item">
                    <img src="img/img.png" alt="Item name" class="item-img">
                    <div class="item-info">
                        <h2>Name</h2>
                        <p>Short description of item</p>
                        <p>Condition</p>
                        <p class="price">Price $</p>
                    </div>
                </div>

            </section>

            <!-- RIGHT COLUMN -->
            <div class="sidebar">

                <div class="info-box">
                    <p>Lorem ipsum dolor sit amet...</p>
                </div>

                <div class="promo-box">
                    <h3>Promo code</h3>
                    <input type="text" class="promo-input">
                    <button class="btn">Enter code</button>
                </div>

                <div class="total-box">
                    <h3>Cart total: $$$</h3>
                    <button class="btn">Buy Now</button>
                </div>

            </div>

        </section>
